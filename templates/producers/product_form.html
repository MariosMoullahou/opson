{% extends "base.html" %}

{% block category_nav %}{% endblock %}

{% block content %}
<section class="container" style="padding: 36px 24px; max-width: 720px;">
  <h1 class="page-title">+ Πρόσθεσε νέο προϊόν</h1>
  <p class="page-subtitle" style="margin-bottom: 24px;">Συμπλήρωσε τα στοιχεία του προϊόντος σου.</p>

  <form method="post" class="panel">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Όνομα προϊόντος</label>
      <input name="name" required class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">Περιγραφή</label>
      <textarea name="description" rows="3" class="form-textarea"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="form-group">
        <label class="form-label">Τιμή (€)</label>
        <input name="price" type="number" step="0.01" required class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Μονάδα</label>
        <select name="unit" class="form-select">
          {% for value, label in units %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Απόθεμα</label>
        <input name="stock" type="number" required class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Κατηγορία</label>
        <select name="category" class="form-select">
          <option value="">—</option>
          {% for c in categories %}<option value="{{ c.pk }}">{{ c.emoji }} {{ c.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">URL εικόνας (προαιρετικό)</label>
      <input name="image_url" class="form-input" placeholder="https://...">
    </div>
    <button class="btn-primary" type="submit" style="width:100%;padding:12px;">Προσθήκη προϊόντος</button>
  </form>
</section>
{% endblock %}
