# nginx server block for the Opson demo at demo.eopson.gr
# This is a SEPARATE site file — it does not touch the existing eopson.gr config.
# WhiteNoise serves /static/ through gunicorn, so no nginx `static` location is needed.
# certbot will rewrite this file to add the TLS (listen 443) block.

server {
    listen 80;
    server_name demo.eopson.gr;

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/opson.sock;
    }
}
