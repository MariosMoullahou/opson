# nginx server block for the Opson demo at demo.eopson.gr
# This is a SEPARATE site file — it does not touch the existing eopson.gr config.
# WhiteNoise serves /static/ through gunicorn, so no nginx `static` location is needed.
# certbot will rewrite this file to add the TLS (listen 443) block.

server {
    listen 80;
    server_name demo.eopson.gr;

    client_max_body_size 10M;   # producer uploads are capped at 8MB by core.images

    # Producer uploads, when running without S3 (AWS_STORAGE_BUCKET_NAME unset).
    # WhiteNoise deliberately does not serve MEDIA_ROOT, and Django will not serve it
    # with DEBUG=False, so nginx has to. Harmless when S3 is configured: nothing is
    # written here and no URL points at it.
    location /media/ {
        alias /var/www/opson/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/opson.sock;
    }
}
