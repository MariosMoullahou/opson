# nginx server block for the Opson demo at demo.eopson.gr
# This is a SEPARATE site file — it does not touch the existing eopson.gr config.
# WhiteNoise serves /static/ through gunicorn, so no nginx `static` location is needed.
# Producer uploads are served by CloudFront and never reach this box, so there is no
# /media/ location either.
# certbot will rewrite this file to add the TLS (listen 443) block.

server {
    listen 80;
    server_name demo.eopson.gr;

    # Uploads are POSTed to Django before it forwards them to S3, so they do pass
    # through nginx. The 1M default would reject them with a 413 before Django could
    # return its own Greek "μέγιστο 8MB" message.
    client_max_body_size 10M;

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/opson.sock;
    }
}
